<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Camera Hub</title>

  <!-- PWA & Mobile Configuration -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiveHub" />
  <link rel="icon" type="image/svg+xml" href="icon-192.svg" />
  <link rel="apple-touch-icon" href="icon-192.svg" />

  <!-- WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed mobile scroll: natural flow + disable pull-to-refresh without locking body */
    html {
      overscroll-behavior-y: contain;
      background-color: #0b0f17;
    }

    body {
      background-color: #0b0f17;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 40px;
    }

    /* Authentication Overlay */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 23, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }

    .auth-card {
      background: #131d2e;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 28px 22px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      text-align: center;
    }

    .auth-card h2 { font-size: 22px; margin-bottom: 6px; }
    .auth-card p { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      margin-bottom: 14px;
    }

    .field label { font-size: 12px; color: #cbd5e1; font-weight: 600; }
    .field input {
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: #38bdf8; }

    .auth-error { font-size: 12px; color: #ef4444; margin-bottom: 12px; min-height: 16px; }

    .btn-auth {
      width: 100%;
      padding: 11px;
      background: #38bdf8;
      color: #020617;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Responsive Sticky Header */
    header {
      padding: 12px 16px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; flex-shrink: 0; }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .search-box {
      flex: 1 1 200px;
      max-width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 7px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-tag {
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
    }

    button {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-live { background: #ef4444; color: #fff; }
    .btn-stop { background: #475569; color: #f8fafc; }
    .btn-refresh { background: #0284c7; color: #fff; display: flex; align-items: center; gap: 4px; }
    .btn-logout { background: #334155; color: #fca5a5; }
    .btn-media { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }

    /* Main Container & Fluid Grid */
    main {
      flex: 1;
      padding: 16px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    @media (max-width: 480px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
      .search-box {
        max-width: 100%;
        order: 3;
        flex-basis: 100%;
      }
    }

    .video-card {
      background: #131d2e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .video-card.hidden { display: none !important; }

    .video-box {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #020617;
      cursor: pointer;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-name {
      background: rgba(0, 0, 0, 0.75);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      backdrop-filter: blur(4px);
    }

    .badge-fullscreen {
      background: rgba(56, 189, 248, 0.9);
      color: #020617;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Card Footer (Viewers + Score + Buttons) */
    .card-footer {
      padding: 10px 14px;
      background: #0d1524;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-metrics {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .viewer-tag {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .score-tag {
      font-size: 13px;
      font-weight: 700;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .point-buttons { display: flex; gap: 6px; }

    .btn-point {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .btn-point-plus { background: #065f46; color: #34d399; }
    .btn-point-plus:active { transform: scale(0.92); }
    .btn-point-minus { background: #7f1d1d; color: #f87171; }
    .btn-point-minus:active { transform: scale(0.92); }

    /* Comment Section */
    .comment-section {
      background: #090d16;
      border-top: 1px solid #1e293b;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      height: 155px;
    }

    .comment-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .comment-item { line-height: 1.4; word-break: break-word; }
    .comment-author { font-weight: 600; color: #38bdf8; }

    .comment-form { display: flex; gap: 6px; }

    .comment-form input {
      flex: 1;
      padding: 6px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .comment-form button {
      background: #38bdf8;
      color: #020617;
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Modal */
    #fullscreenModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #fullscreenModal.active { display: flex; }
    #modalVideo { max-width: 95vw; max-height: 80vh; border-radius: 8px; }
    .modal-controls { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
    .btn-close { background: #ef4444; color: #fff; }
    .btn-mute { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <!-- Auth Dialog -->
  <div id="authOverlay">
    <div class="auth-card">
      <h2>Welcome to Live Hub</h2>
      <p>Enter your username and a 6-digit PIN.</p>
      
      <div class="field">
        <label>Username</label>
        <input type="text" id="authName" placeholder="Enter username" autocomplete="off" />
      </div>

      <div class="field">
        <label>6-Digit PIN</label>
        <input type="password" id="authPin" placeholder="••••••" maxlength="6" inputmode="numeric" />
      </div>

      <div class="auth-error" id="authError"></div>
      <button class="btn-auth" onclick="handleAuth()">Enter Hub</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div id="statusDot" class="status-dot"></div>
      <span>Live Hub</span>
    </div>

    <div class="search-box">
      <input type="text" id="streamSearch" placeholder="🔍 Search streamer..." oninput="filterStreams()" />
    </div>

    <div class="controls">
      <button class="btn-refresh" onclick="manualRefresh()" title="Scan for latest cameras">🔄 Refresh</button>
      <span class="user-tag" id="userBadge">Guest</span>
      <button id="goLiveBtn" class="btn-live" onclick="toggleBroadcasting()">Go Live</button>
      <button id="toggleCamBtn" class="btn-media" onclick="toggleCamera()" style="display:none;">Cam Off</button>
      <button id="toggleMicBtn" class="btn-media" onclick="toggleMic()" style="display:none;">Mute Mic</button>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="video-grid" id="grid">
      <div id="emptyNotice" style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748b;">
        Connecting to active online cameras...
      </div>
    </div>
  </main>

  <!-- Fullscreen Modal -->
  <div id="fullscreenModal">
    <video id="modalVideo" autoplay playsinline></video>
    <div class="modal-controls">
      <span id="modalTitle" class="badge-name">Stream</span>
      <button id="modalMuteBtn" class="btn-mute" onclick="toggleModalAudio()">Mute Audio</button>
      <button class="btn-close" onclick="closeFullscreen()">Exit Fullscreen</button>
    </div>
  </div>

  <script>
    // Paste your deployed Google Apps Script URL here:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxB-xsqymTmcVU7tqiitoD47zkN0j-5qHmMwxKoOGTdTdWdLcabGg-VB6-H-g9ENYncRg/exec";
    const ROOM_ID = "room1";

    let currentUser = null;
    let peer = null;
    let myPeerId = null;
    let localStream = null;
    let isBroadcaster = false;
    let outgoingCalls = {};
    let syncTimer = null;

    // Register PWA Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => console.log("SW Reg Error:", err));
      });
    }

    // Auto load session
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("camhub_auth");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("authOverlay").style.display = "none";
        initHub();
      }
    });

    async function handleAuth() {
      const name = document.getElementById("authName").value.trim();
      const pin = document.getElementById("authPin").value.trim();
      const errEl = document.getElementById("authError");
      errEl.textContent = "";

      if (!name) {
        errEl.textContent = "Please enter your username.";
        return;
      }
      if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
        errEl.textContent = "PIN must be exactly 6 digits.";
        return;
      }

      errEl.textContent = "Verifying...";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "auth", name: name, pin: pin })
        });
        const resp = await res.json();

        if (resp.status === "ok") {
          currentUser = { name: resp.name, pin: pin };
          localStorage.setItem("camhub_auth", JSON.stringify(currentUser));
          document.getElementById("authOverlay").style.display = "none";
          initHub();
        } else {
          errEl.textContent = resp.message || "Authentication failed.";
        }
      } catch (err) {
        errEl.textContent = "Network error. Try again.";
      }
    }

    async function handleLogout() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (myPeerId) {
        navigator.sendBeacon(SCRIPT_URL, JSON.stringify({ action: "logout", peerId: myPeerId }));
      }

      clearInterval(syncTimer);
      if (peer) peer.destroy();

      localStorage.removeItem("camhub_auth");
      currentUser = null;
      myPeerId = null;
      isBroadcaster = false;
      outgoingCalls = {};

      document.getElementById("grid").innerHTML = `
        <div id="emptyNotice" style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748b;">
          Connecting to active online cameras...
        </div>
      `;
      document.getElementById("statusDot").classList.remove("online");
      document.getElementById("authName").value = "";
      document.getElementById("authPin").value = "";
      document.getElementById("authError").textContent = "";
      document.getElementById("authOverlay").style.display = "flex";
      document.getElementById("goLiveBtn").textContent = "Go Live";
      document.getElementById("goLiveBtn").className = "btn-live";
      document.getElementById("toggleCamBtn").style.display = "none";
      document.getElementById("toggleMicBtn").style.display = "none";
    }

    function initHub() {
      document.getElementById("userBadge").textContent = currentUser.name;

      peer = new Peer({
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
          ]
        }
      });

      peer.on("open", (id) => {
        myPeerId = id;
        document.getElementById("statusDot").classList.add("online");
        syncRegistry();
        syncTimer = setInterval(syncRegistry, 4000);
      });

      peer.on("call", (call) => {
        call.answer();
        const broadcasterName = call.metadata?.name || "Broadcaster";
        call.on("stream", (remoteStream) => {
          renderCard(call.peer, broadcasterName, remoteStream, false);
        });
        call.on("close", () => {
          removeCard(call.peer);
        });
      });
    }

    async function toggleBroadcasting() {
      const liveBtn = document.getElementById("goLiveBtn");

      if (!isBroadcaster) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } },
            audio: true
          });

          isBroadcaster = true;
          liveBtn.textContent = "Stop Live";
          liveBtn.className = "btn-stop";
          document.getElementById("toggleCamBtn").style.display = "inline-block";
          document.getElementById("toggleMicBtn").style.display = "inline-block";

          renderCard("local", currentUser.name + " (You)", localStream, true);
          syncRegistry();
        } catch (err) {
          alert("Could not access camera/mic: " + err.message);
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        Object.values(outgoingCalls).forEach(call => call.close());
        outgoingCalls = {};

        isBroadcaster = false;
        liveBtn.textContent = "Go Live";
        liveBtn.className = "btn-live";
        document.getElementById("toggleCamBtn").style.display = "none";
        document.getElementById("toggleMicBtn").style.display = "none";

        removeCard("local");
        syncRegistry();
      }
    }

    function manualRefresh() {
      const btn = document.querySelector(".btn-refresh");
      btn.textContent = "Scanning...";
      syncRegistry().finally(() => {
        setTimeout(() => { btn.textContent = "🔄 Refresh"; }, 800);
      });
    }

    async function syncRegistry() {
      if (!myPeerId || !currentUser) return;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "heartbeat",
            room: ROOM_ID,
            peerId: myPeerId,
            name: currentUser.name,
            role: isBroadcaster ? "broadcaster" : "viewer"
          })
        });

        const res = await fetch(`${SCRIPT_URL}?room=${encodeURIComponent(ROOM_ID)}`);
        const data = await res.json();

        // Update card metadata (Viewer count beside score & comments)
        data.broadcasters.forEach(b => {
          if (b.peerId === myPeerId && isBroadcaster) {
            updateCardMeta("local", data.totalAudience, b.score, b.comments);
          } else {
            updateCardMeta(b.peerId, data.totalAudience, b.score, b.comments);
          }
        });

        // Push outgoing stream to new viewers & peer broadcasters
        if (isBroadcaster && localStream) {
          data.viewers.forEach(v => {
            if (v.peerId !== myPeerId && !outgoingCalls[v.peerId]) {
              const call = peer.call(v.peerId, localStream, {
                metadata: { name: currentUser.name }
              });
              outgoingCalls[v.peerId] = call;
            }
          });

          data.broadcasters.forEach(b => {
            if (b.peerId !== myPeerId && !outgoingCalls[b.peerId] && myPeerId > b.peerId) {
              const call = peer.call(b.peerId, localStream, {
                metadata: { name: currentUser.name }
              });
              outgoingCalls[b.peerId] = call;
            }
          });
        }

        // Clean offline broadcasters
        const activeBroadcasterIds = new Set(data.broadcasters.map(b => b.peerId));
        document.querySelectorAll(".video-card").forEach(card => {
          const id = card.id.replace("card-", "");
          if (id !== "local" && !activeBroadcasterIds.has(id)) {
            removeCard(id);
          }
        });

        filterStreams();
      } catch (err) {
        console.error("Sync error:", err);
      }
    }

    function renderCard(id, name, stream, isMuted) {
      document.getElementById("emptyNotice").style.display = "none";
      if (document.getElementById("card-" + id)) return;

      const grid = document.getElementById("grid");
      const card = document.createElement("div");
      card.className = "video-card";
      card.id = "card-" + id;
      card.setAttribute("data-name", name.toLowerCase());

      card.innerHTML = `
        <div class="video-box" id="box-${id}">
          <div class="video-overlay">
            <span class="badge-name">${name}</span>
            <span class="badge-fullscreen">Full View + Sound</span>
          </div>
        </div>
        <div class="card-footer">
          <div class="meta-metrics">
            <div class="viewer-tag">👁 <span id="viewers-${id}">0</span></div>
            <div class="score-tag">⭐ <span id="score-${id}">0</span></div>
          </div>
          <div class="point-buttons">
            <button class="btn-point btn-point-plus" onclick="sendScore('${id}', 1)">+1</button>
            <button class="btn-point btn-point-minus" onclick="sendScore('${id}', -1)">-1</button>
          </div>
        </div>
        <div class="comment-section">
          <div class="comment-list" id="comments-${id}"></div>
          <div class="comment-form">
            <input type="text" id="input-comment-${id}" placeholder="Type a comment..." onkeydown="if(event.key==='Enter') sendComment('${id}')" />
            <button onclick="sendComment('${id}')">Send</button>
          </div>
        </div>
      `;

      const video = document.createElement("video");
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = isMuted;

      const box = card.querySelector(`#box-${id}`);
      box.prepend(video);
      box.onclick = () => openFullscreen(name, stream);

      grid.appendChild(card);
    }

    function updateCardMeta(id, viewers, score, comments) {
      const vEl = document.getElementById(`viewers-${id}`);
      const sEl = document.getElementById(`score-${id}`);
      const cEl = document.getElementById(`comments-${id}`);

      if (vEl) vEl.textContent = viewers !== undefined ? viewers : 0;
      if (sEl) sEl.textContent = score !== undefined ? score : 0;

      if (cEl && comments) {
        cEl.innerHTML = comments.map(c => `
          <div class="comment-item">
            <span class="comment-author">${escapeHtml(c.user)}:</span> ${escapeHtml(c.text)}
          </div>
        `).join("");
        cEl.scrollTop = cEl.scrollHeight;
      }
    }

    function removeCard(id) {
      const card = document.getElementById("card-" + id);
      if (card) card.remove();
      if (outgoingCalls[id]) {
        outgoingCalls[id].close();
        delete outgoingCalls[id];
      }
      if (document.querySelectorAll(".video-card").length === 0) {
        document.getElementById("emptyNotice").style.display = "block";
      }
    }

    async function sendScore(cardId, delta) {
      const targetPeerId = cardId === "local" ? myPeerId : cardId;
      const sEl = document.getElementById(`score-${cardId}`);
      if (sEl) {
        const current = parseInt(sEl.textContent || "0", 10);
        sEl.textContent = current + delta;
      }

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "vote",
          targetPeerId: targetPeerId,
          delta: delta
        })
      });
    }

    async function sendComment(cardId) {
      const targetPeerId = cardId === "local" ? myPeerId : cardId;
      const input = document.getElementById(`input-comment-${cardId}`);
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "comment",
          targetPeerId: targetPeerId,
          user: currentUser.name,
          text: text
        })
      });

      syncRegistry();
    }

    function filterStreams() {
      const query = document.getElementById("streamSearch").value.trim().toLowerCase();
      const cards = document.querySelectorAll(".video-card");
      cards.forEach(card => {
        const streamName = card.getAttribute("data-name") || "";
        if (streamName.includes(query)) {
          card.classList.remove("hidden");
        } else {
          card.classList.add("hidden");
        }
      });
    }

    function openFullscreen(title, stream) {
      const modal = document.getElementById("fullscreenModal");
      const modalVideo = document.getElementById("modalVideo");
      document.getElementById("modalTitle").textContent = title;
      modalVideo.srcObject = stream;
      modalVideo.muted = false;
      modal.classList.add("active");
    }

    function closeFullscreen() {
      const modal = document.getElementById("fullscreenModal");
      const modalVideo = document.getElementById("modalVideo");
      modalVideo.srcObject = null;
      modalVideo.muted = true;
      modal.classList.remove("active");
    }

    function toggleModalAudio() {
      const modalVideo = document.getElementById("modalVideo");
      modalVideo.muted = !modalVideo.muted;
      document.getElementById("modalMuteBtn").textContent = modalVideo.muted ? "Unmute Audio" : "Mute Audio";
    }

    function toggleCamera() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("toggleCamBtn").textContent = track.enabled ? "Cam Off" : "Cam On";
      }
    }

    function toggleMic() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("toggleMicBtn").textContent = track.enabled ? "Mute Mic" : "Unmute Mic";
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    window.addEventListener("beforeunload", () => {
      if (myPeerId) {
        navigator.sendBeacon(SCRIPT_URL, JSON.stringify({ action: "leave", peerId: myPeerId }));
      }
    });
  </script>
</body>
</html>
