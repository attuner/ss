<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Camera Hub & Interactive Viewer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 12px 20px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .search-box {
      flex: 1;
      max-width: 380px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 8px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus { border-color: #38bdf8; }

    .controls { display: flex; gap: 8px; align-items: center; }
    input.user-input { padding: 8px 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
    .btn-live { background: #ef4444; color: #fff; }
    .btn-stop { background: #475569; color: #f8fafc; }
    .btn-media { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }

    main { flex: 1; padding: 20px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #131d2e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }
    .video-card.hidden { display: none !important; }

    .video-box {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #020617;
      cursor: pointer;
    }
    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .badge-name { background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border-radius: 6px; font-size: 12px; backdrop-filter: blur(4px); }
    .badge-fullscreen { background: rgba(56, 189, 248, 0.9); color: #020617; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }

    .card-footer {
      padding: 10px 14px;
      background: #0d1524;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
    }
    .viewer-tag { font-size: 12px; color: #38bdf8; display: flex; align-items: center; gap: 4px; }
    .reaction-bar { display: flex; gap: 8px; }
    .btn-react {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .btn-react:hover { background: #334155; }

    /* Interactive Comments Box */
    .comment-section {
      background: #090d16;
      border-top: 1px solid #1e293b;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      height: 160px;
    }
    .comment-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 8px;
      padding-right: 4px;
    }
    .comment-list::-webkit-scrollbar { width: 4px; }
    .comment-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .comment-item { line-height: 1.4; word-break: break-word; }
    .comment-author { font-weight: 600; color: #38bdf8; }

    .comment-form { display: flex; gap: 6px; }
    .comment-form input {
      flex: 1;
      padding: 6px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .comment-form button {
      background: #38bdf8;
      color: #020617;
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Fullscreen Modal View */
    #fullscreenModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #fullscreenModal.active { display: flex; }
    #modalVideo { max-width: 95vw; max-height: 80vh; border-radius: 8px; }
    .modal-controls { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
    .btn-close { background: #ef4444; color: #fff; }
    .btn-mute { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="statusDot" class="status-dot"></div>
      <span>Live Cam Network</span>
    </div>

    <!-- Live Stream Search Input -->
    <div class="search-box">
      <input type="text" id="streamSearch" placeholder="🔍 Search streamer by name..." oninput="filterStreams()" />
    </div>

    <div class="controls">
      <input type="text" id="userInput" class="user-input" placeholder="Your Name" />
      <button id="goLiveBtn" class="btn-live" onclick="toggleBroadcasting()">Go Live (Camera)</button>
      <button id="toggleCamBtn" class="btn-media" onclick="toggleCamera()" style="display:none;">Cam Off</button>
      <button id="toggleMicBtn" class="btn-media" onclick="toggleMic()" style="display:none;">Mute Mic</button>
    </div>
  </header>

  <main>
    <div class="video-grid" id="grid">
      <div id="emptyNotice" style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748b;">
        Connecting to online cameras...
      </div>
    </div>
  </main>

  <!-- Fullscreen Modal View -->
  <div id="fullscreenModal">
    <video id="modalVideo" autoplay playsinline></video>
    <div class="modal-controls">
      <span id="modalTitle" class="badge-name">Stream</span>
      <button id="modalMuteBtn" class="btn-mute" onclick="toggleModalAudio()">Mute Audio</button>
      <button class="btn-close" onclick="closeFullscreen()">Exit Fullscreen</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxB-xsqymTmcVU7tqiitoD47zkN0j-5qHmMwxKoOGTdTdWdLcabGg-VB6-H-g9ENYncRg/exec";
    const ROOM_ID = "room1";

    let peer = null;
    let myPeerId = null;
    let localStream = null;
    let isBroadcaster = false;
    let activeCalls = {};
    let currentStreamsData = {};
    let userName = "Visitor_" + Math.floor(100 + Math.random() * 900);

    document.getElementById("userInput").value = userName;

    // Automatic Join as a Viewer on load (No camera required)
    window.addEventListener("DOMContentLoaded", () => {
      initPeer();
    });

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
          ]
        }
      });

      peer.on("open", (id) => {
        myPeerId = id;
        document.getElementById("statusDot").classList.add("online");

        // Sync with Google Sheet immediately and every 4s
        syncRegistry();
        setInterval(syncRegistry, 4000);
      });

      // Handle receiving stream from broadaster
      peer.on("call", (call) => {
        call.answer(localStream || undefined);
        const callerName = call.metadata?.name || "Broadcaster";

        call.on("stream", (remoteStream) => {
          renderCard(call.peer, callerName, remoteStream, false);
        });

        call.on("close", () => {
          removeCard(call.peer);
        });

        activeCalls[call.peer] = call;
      });
    }

    // Toggle Broadcaster Mode
    async function toggleBroadcasting() {
      const liveBtn = document.getElementById("goLiveBtn");
      const nameVal = document.getElementById("userInput").value.trim();
      if (nameVal) userName = nameVal;

      if (!isBroadcaster) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } },
            audio: true
          });

          isBroadcaster = true;
          liveBtn.textContent = "Stop Live";
          liveBtn.className = "btn-stop";
          document.getElementById("toggleCamBtn").style.display = "inline-block";
          document.getElementById("toggleMicBtn").style.display = "inline-block";
          document.getElementById("userInput").disabled = true;

          renderCard("local", userName + " (You)", localStream, true);
          syncRegistry();
        } catch (err) {
          alert("Camera/Audio access failed: " + err.message);
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        isBroadcaster = false;
        liveBtn.textContent = "Go Live (Camera)";
        liveBtn.className = "btn-live";
        document.getElementById("toggleCamBtn").style.display = "none";
        document.getElementById("toggleMicBtn").style.display = "none";
        document.getElementById("userInput").disabled = false;

        removeCard("local");
        syncRegistry();
      }
    }

    // Sheet Syncing & Peer Discovery
    async function syncRegistry() {
      if (!myPeerId || SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL") return;

      try {
        // Send heartbeat
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "heartbeat",
            room: ROOM_ID,
            peerId: myPeerId,
            name: userName,
            role: isBroadcaster ? "broadcaster" : "viewer"
          })
        });

        // Get active broadcasters, counts, reactions & comments
        const res = await fetch(`${SCRIPT_URL}?room=${encodeURIComponent(ROOM_ID)}`);
        const data = await res.json();

        const activeBroadcasterIds = new Set(data.broadcasters.map(b => b.peerId));

        // Update cards with latest viewer count, likes, and comments
        data.broadcasters.forEach(b => {
          currentStreamsData[b.peerId] = b;
          updateCardMeta(b.peerId, data.viewerCount, b.likes, b.dislikes, b.comments);

          // If viewer has not connected to this broadcaster yet, call them to receive feed
          if (b.peerId !== myPeerId && !activeCalls[b.peerId]) {
            const call = peer.call(b.peerId, localStream || undefined, {
              metadata: { name: userName }
            });

            call.on("stream", (remoteStream) => {
              renderCard(b.peerId, b.name, remoteStream, false);
            });

            call.on("close", () => {
              removeCard(b.peerId);
            });

            activeCalls[b.peerId] = call;
          }
        });

        // Clean up disconnected broadcasters
        Object.keys(activeCalls).forEach(id => {
          if (!activeBroadcasterIds.has(id)) {
            removeCard(id);
          }
        });

        filterStreams(); // Re-apply search filter
      } catch (err) {
        console.error("Sync error:", err);
      }
    }

    // Build the Card UI (Video + Likes + Dislikes + Comments)
    function renderCard(id, name, stream, isMuted) {
      document.getElementById("emptyNotice").style.display = "none";
      if (document.getElementById("card-" + id)) return;

      const grid = document.getElementById("grid");
      const card = document.createElement("div");
      card.className = "video-card";
      card.id = "card-" + id;
      card.setAttribute("data-name", name.toLowerCase());

      card.innerHTML = `
        <div class="video-box" id="box-${id}">
          <div class="video-overlay">
            <span class="badge-name">${name}</span>
            <span class="badge-fullscreen">Full Screen + Sound</span>
          </div>
        </div>
        <div class="card-footer">
          <div class="viewer-tag">👁 <span id="viewers-${id}">0</span> watching</div>
          <div class="reaction-bar">
            <button class="btn-react" onclick="sendReaction('${id}', 'like')">👍 <span id="likes-${id}">0</span></button>
            <button class="btn-react" onclick="sendReaction('${id}', 'dislike')">👎 <span id="dislikes-${id}">0</span></button>
          </div>
        </div>
        <div class="comment-section">
          <div class="comment-list" id="comments-${id}"></div>
          <div class="comment-form">
            <input type="text" id="input-comment-${id}" placeholder="Type comment..." onkeydown="if(event.key==='Enter') sendComment('${id}')" />
            <button onclick="sendComment('${id}')">Send</button>
          </div>
        </div>
      `;

      const video = document.createElement("video");
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = isMuted;

      const box = card.querySelector(`#box-${id}`);
      box.prepend(video);
      box.onclick = () => openFullscreen(name, stream);

      grid.appendChild(card);
    }

    // Update real-time metadata on card
    function updateCardMeta(id, viewers, likes, dislikes, comments) {
      const vEl = document.getElementById(`viewers-${id}`);
      const lEl = document.getElementById(`likes-${id}`);
      const dEl = document.getElementById(`dislikes-${id}`);
      const cEl = document.getElementById(`comments-${id}`);

      if (vEl) vEl.textContent = viewers;
      if (lEl) lEl.textContent = likes || 0;
      if (dEl) dEl.textContent = dislikes || 0;

      if (cEl && comments) {
        cEl.innerHTML = comments.map(c => `
          <div class="comment-item">
            <span class="comment-author">${escapeHtml(c.user)}:</span> ${escapeHtml(c.text)}
          </div>
        `).join("");
        cEl.scrollTop = cEl.scrollHeight;
      }
    }

    function removeCard(id) {
      const card = document.getElementById("card-" + id);
      if (card) card.remove();
      if (activeCalls[id]) {
        activeCalls[id].close();
        delete activeCalls[id];
      }
      delete currentStreamsData[id];

      if (document.querySelectorAll(".video-card").length === 0) {
        document.getElementById("emptyNotice").style.display = "block";
      }
    }

    // Send Reaction (Like/Dislike)
    async function sendReaction(targetPeerId, reactionType) {
      // Optimistic local update
      const counterEl = document.getElementById(`${reactionType}s-${targetPeerId}`);
      if (counterEl) counterEl.textContent = parseInt(counterEl.textContent || 0) + 1;

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "reaction",
          targetPeerId: targetPeerId,
          reactionType: reactionType
        })
      });
    }

    // Send Live Comment
    async function sendComment(targetPeerId) {
      const input = document.getElementById(`input-comment-${targetPeerId}`);
      const text = input.value.trim();
      if (!text) return;

      input.value = "";

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "comment",
          targetPeerId: targetPeerId,
          user: userName,
          text: text
        })
      });

      syncRegistry();
    }

    // Search and Filter Stream Cards
    function filterStreams() {
      const query = document.getElementById("streamSearch").value.trim().toLowerCase();
      const cards = document.querySelectorAll(".video-card");
      cards.forEach(card => {
        const streamName = card.getAttribute("data-name") || "";
        if (streamName.includes(query)) {
          card.classList.remove("hidden");
        } else {
          card.classList.add("hidden");
        }
      });
    }

    // Fullscreen View
    function openFullscreen(title, stream) {
      const modal = document.getElementById("fullscreenModal");
      const modalVideo = document.getElementById("modalVideo");
      document.getElementById("modalTitle").textContent = title;
      modalVideo.srcObject = stream;
      modalVideo.muted = false; // Enable audio
      modal.classList.add("active");
    }

    function closeFullscreen() {
      const modal = document.getElementById("fullscreenModal");
      const modalVideo = document.getElementById("modalVideo");
      modalVideo.srcObject = null;
      modalVideo.muted = true;
      modal.classList.remove("active");
    }

    function toggleModalAudio() {
      const modalVideo = document.getElementById("modalVideo");
      modalVideo.muted = !modalVideo.muted;
      document.getElementById("modalMuteBtn").textContent = modalVideo.muted ? "Unmute Audio" : "Mute Audio";
    }

    function toggleCamera() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("toggleCamBtn").textContent = track.enabled ? "Cam Off" : "Cam On";
      }
    }

    function toggleMic() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("toggleMicBtn").textContent = track.enabled ? "Mute Mic" : "Unmute Mic";
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    window.addEventListener("beforeunload", () => {
      if (myPeerId) {
        navigator.sendBeacon(SCRIPT_URL, JSON.stringify({ action: "leave", peerId: myPeerId }));
      }
    });
  </script>
</body>
</html>
