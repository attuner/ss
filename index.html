<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Device & Screen Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 16px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #1e293b; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input { padding: 8px 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; }
    button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-start { background: #10b981; color: #022c22; }
    .btn-stop { background: #ef4444; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #1e293b; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #111827; border-radius: 8px; overflow: hidden; border: 1px solid #1f2937; }
    .card-header { padding: 8px 12px; font-size: 13px; display: flex; justify-content: space-between; background: #030712; }
    .card-img-container { width: 100%; height: 180px; background: #000; display: flex; align-items: center; justify-content: center; }
    .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <header>
    <div>
      <h2>Live Device Grid</h2>
      <span id="modeBadge" class="status-badge">Detecting capabilities...</span>
    </div>
    <div class="controls">
      <input type="text" id="username" placeholder="Your Name" />
      <button id="startBtn" class="btn-start" onclick="startBroadcast()">Start Sharing</button>
      <button id="stopBtn" class="btn-stop" onclick="stopBroadcast()" disabled>Stop</button>
    </div>
  </header>

  <div class="grid" id="screensContainer"></div>

  <video id="captureVideo" autoplay playsinline muted style="display:none;"></video>
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxB-xsqymTmcVU7tqiitoD47zkN0j-5qHmMwxKoOGTdTdWdLcabGg-VB6-H-g9ENYncRg/exec";
    let localStream = null;
    let uploadTimer = null;
    let myUserId = "Device_" + Math.floor(1000 + Math.random() * 9000);

    document.getElementById("username").value = myUserId;

    // Check if device supports true screen sharing or needs camera fallback
    const hasScreenShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
    const startBtn = document.getElementById("startBtn");
    const modeBadge = document.getElementById("modeBadge");

    if (hasScreenShare) {
      modeBadge.textContent = "Desktop Mode (Full Screen)";
      startBtn.textContent = "Share Screen";
    } else {
      modeBadge.textContent = "Mobile Mode (Camera Feed)";
      startBtn.textContent = "Share Camera";
    }

    async function startBroadcast() {
      const nameInput = document.getElementById("username").value.trim();
      if (nameInput) myUserId = nameInput;

      try {
        if (hasScreenShare) {
          // Desktop Screen Capture
          localStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: 5, width: { max: 1280 } },
            audio: false
          });
        } else {
          // Mobile Fallback: Camera Stream
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { max: 640 } },
            audio: false
          });
        }

        const video = document.getElementById("captureVideo");
        video.srcObject = localStream;
        await video.play();

        startBtn.disabled = true;
        document.getElementById("stopBtn").disabled = false;
        document.getElementById("username").disabled = true;

        localStream.getVideoTracks()[0].onended = stopBroadcast;

        // Push frames every 4 seconds
        uploadTimer = setInterval(captureAndUpload, 4000);
        captureAndUpload();
      } catch (err) {
        console.warn("Broadcast canceled or permission denied:", err);
      }
    }

    function stopBroadcast() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      clearInterval(uploadTimer);
      startBtn.disabled = false;
      document.getElementById("stopBtn").disabled = true;
      document.getElementById("username").disabled = false;
    }

    async function captureAndUpload() {
      const video = document.getElementById("captureVideo");
      const canvas = document.getElementById("captureCanvas");
      if (!video.videoWidth) return;

      const targetWidth = 480;
      const targetHeight = Math.round((video.videoHeight / video.videoWidth) * targetWidth);
      canvas.width = targetWidth;
      canvas.height = targetHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

      const base64 = canvas.toDataURL("image/jpeg", 0.3);

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ userId: myUserId, image: base64 })
        });
      } catch (err) {
        console.error("Frame push error:", err);
      }
    }

    async function syncScreens() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        renderGrid(data);
      } catch (e) {
        console.error("Screen poll error:", e);
      }
    }

    function renderGrid(users) {
      const container = document.getElementById("screensContainer");
      const keys = Object.keys(users);

      if (keys.length === 0) {
        container.innerHTML = `<p style="color: #64748b; font-size: 14px;">No active screens broadcasting.</p>`;
        return;
      }

      container.innerHTML = "";
      keys.forEach(id => {
        const isSelf = id === myUserId;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span>${id} ${isSelf ? "(You)" : ""}</span>
            <span style="color: #10b981;">● Online</span>
          </div>
          <div class="card-img-container">
            <img src="${users[id].image}" alt="Feed of ${id}" />
          </div>
        `;
        container.appendChild(card);
      });
    }

    syncScreens();
    setInterval(syncScreens, 4000);
  </script>
</body>
</html>
